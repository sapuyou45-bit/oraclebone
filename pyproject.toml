[project]
name = "oraclebone"
version = "8.2.0"
description = "The bone cracks. The model reads. Audited divination skills for AI agents — tarot, I Ching, Xiao Liu Ren, Bazi."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
lunar = [
  "lunar-python>=1.4.4"
]
dev = [
  "build",
  "twine",
  "PyYAML>=6",
  "lunar-python>=1.4.4",
  "jsonschema>=4.25"
]

[project.scripts]
oraclebone = "oraclebone.cli:main"
oraclebone-mcp = "oraclebone.mcp_server:main"
ai-divination = "oraclebone.cli:main_legacy"
ai-divination-mcp = "oraclebone.mcp_server:main_legacy"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oraclebone*"]

[tool.setuptools.package-data]
oraclebone = ["templates/*.md", "schemas/*.json"]
